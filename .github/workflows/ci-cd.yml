name: BSSONS CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend build check
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Backend dependency check
        working-directory: backend
        run: npm install

      - name: Set lowercase image owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/${{ github.event.repository.name }}-backend:${{ github.sha }}

      - name: Build and push frontend
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: ghcr.io/${{ steps.vars.outputs.owner }}/${{ github.event.repository.name }}-frontend:${{ github.sha }}

      - name: Update GitOps image tags
        if: github.event_name == 'push'
        env:
          OWNER: ${{ steps.vars.outputs.owner }}
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
        run: |
          sed -i "s|ghcr.io/OWNER/REPO-backend|ghcr.io/${OWNER}/${REPO}-backend|g" k8s/overlays/prod/kustomization.yaml
          sed -i "s|ghcr.io/OWNER/REPO-frontend|ghcr.io/${OWNER}/${REPO}-frontend|g" k8s/overlays/prod/kustomization.yaml
          sed -i "s/newTag: .*/newTag: ${SHA}/" k8s/overlays/prod/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "chore(gitops): deploy ${SHA}" || echo "No GitOps changes"
          git push
