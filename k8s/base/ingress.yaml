apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bssons
  namespace: bssons
spec:
  ingressClassName: nginx
  rules:
    - host: bssons.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
